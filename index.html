<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a0615"><title>SpendWise</title>
<style>

*{box-sizing:border-box}html{background:#0a0615}body{margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(520px 380px at 100% -5%,rgba(236,72,153,.26),transparent),radial-gradient(520px 460px at -15% 18%,rgba(124,58,237,.38),transparent),radial-gradient(420px 320px at 100% 85%,rgba(34,211,238,.14),transparent),#0a0615;background-attachment:fixed;min-height:100vh}
#app{max-width:480px;margin:auto;padding:14px 14px 100px}
h2{margin:6px 0 12px;font-size:23px;background:linear-gradient(90deg,#fff,#c4b5fd 60%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}h3{margin:0 0 10px;font-size:15px;color:#e9ddff}.mu{color:var(--mu);font-size:12px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}

.g2 .card{padding-left:18px}.g2 .card:nth-child(5n+1){--ac:#a78bfa}.g2 .card:nth-child(5n+2){--ac:#22d3ee}.g2 .card:nth-child(5n+3){--ac:#f472b6}.g2 .card:nth-child(5n+4){--ac:#34d399}.g2 .card:nth-child(5n){--ac:#fbbf24}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#3b1a8f,#7c3aed 55%,#db2777);color:#fff;border-radius:26px;padding:20px;margin-bottom:12px;box-shadow:0 14px 36px rgba(124,58,237,.45);border:1px solid rgba(255,255,255,.18)}

.btn{border:0;border-radius:16px;padding:14px 16px;color:#fff;font:700 15px inherit;background:linear-gradient(135deg,#7c3aed,#ec4899);width:100%;cursor:pointer;box-shadow:0 8px 22px rgba(236,72,153,.35)}.btn:active{transform:scale(.97)}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(18,10,38,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;max-width:480px;margin:auto;border-radius:24px 24px 0 0}

nav .fab{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:50%;width:54px;height:54px;margin-top:-28px;justify-content:center;box-shadow:0 0 0 5px #0a0615,0 10px 24px rgba(236,72,153,.55);font-size:26px}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 8px currentColor}.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;padding:10px 18px;border-radius:20px;z-index:9;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.splash{height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:60px;text-align:center}.splash h1{background:linear-gradient(90deg,#fff,#c4b5fd,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}.splash>div:first-child{animation:pl 1.4s ease-in-out infinite;filter:drop-shadow(0 0 22px #a855f7)}@keyframes pl{50%{transform:scale(1.12)}}
</style></head><body><div id="toast"></div><div id="app"></div>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
const CLOUD=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/YOUR_/.test(window.FIREBASE_CONFIG.apiKey)&&window.firebase);let K='spendwise.v1',S;if(!CLOUD)try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{user:null,exp:[],goals:[],cats:[],pending:[]}; // pending[] = future SMS suggestions (unconfirmed, never auto-saved)
const NAT=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor.Plugins.LocalNotifications:null;let NP='',EX='',busy=0,tmr,AU=null,FS=null,AUTHED=false,ptmr,AM='in',PN='';
const save=()=>{S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}schedSoon();cloudPush()};
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dt=s=>new Date(s+'T00:00:00'),TD=()=>ds(new Date());
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE=[['Food','#a78bfa',[['Breakfast','🍳'],['Lunch','🍛'],['Dinner','🍽️'],['Snacks','🥪'],['Tea/Coffee','☕'],['Juice','🧃'],['Restaurant','🏨'],['Delivery','🛵']]],['Family & Household','#f472b6',[['Vegetables','🥦'],['Groceries','🛒'],['Milk','🥛'],['Household','🧴'],['Parents','👪'],['Medicine','💊'],['Family','🏠']]],['Transport','#22d3ee',[['Bus','🚌'],['Auto','🛺'],['Taxi','🚕'],['Petrol','⛽'],['Travel','🧳']]],['Personal','#fbbf24',[['Shopping','🛍️'],['Recharge','📱'],['Entertainment','🎬'],['Personal care','💇'],['Other','✨']]]];
const CATS=()=>[...BASE.flatMap(g=>g[2].map(c=>({n:c[0],e:c[1],g:g[0],c:g[1]}))),...S.cats.map(c=>({n:c.n,e:c.e,g:'Custom',c:'#34d399'}))];
const gc=g=>(BASE.find(b=>b[0]==g)||[0,'#34d399'])[1],find=n=>CATS().find(c=>c.n==n)||{n,e:'✨',g:'Personal',c:'#f59e0b'};
const sum=a=>a.reduce((s,e)=>s+e.amt,0),mon=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);const e=new Date(d.getFullYear(),d.getMonth()+1,0);return[ds(d),ds(e),d.toLocaleString('en',{month:'long'})]};
const wk=()=>{const d=new Date(),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);const e=new Date(d);e.setDate(e.getDate()+6);return[ds(d),ds(e)]};
const rng=k=>{const t=TD(),y=new Date();y.setDate(y.getDate()-1);return{today:[t,t],yest:[ds(y),ds(y)],week:wk(),month:mon(0),prev:mon(-1),custom:[H.a,H.b]}[k]};
const inR=(a,b)=>S.exp.filter(e=>e.date>=a&&e.date<=b);
const days=(a,b)=>{const o=[];for(let d=dt(a);ds(d)<=b;d.setDate(d.getDate()+1))o.push(ds(d));return o};
function st(a,b){const L=inR(a,b),t=TD(),end=b<t?b:t,first=L.length?L.map(e=>e.date).sort()[0]:a,s0=first>a?first:a,el=Math.max(1,days(s0,end>=s0?end:s0).length),dm={};L.forEach(e=>dm[e.date]=(dm[e.date]||0)+e.amt);
const ent=Object.entries(dm),hi=ent.sort((x,y)=>y[1]-x[1])[0],lo=ent.sort((x,y)=>x[1]-y[1])[0],gm={};L.forEach(e=>{const g=find(e.cat).g;gm[g]=(gm[g]||0)+e.amt});const ge=Object.entries(gm).sort((x,y)=>y[1]-x[1]);
return{L,tot:sum(L),avg:sum(L)/el,hi,lo,dm,ge,top:ge[0],low:ge[ge.length-1],el}}
const inc=()=>{const u=S.user;return(u.salary||0)+(u.other||0)+(u.daily||0)*(u.days||30)},bud=()=>inc()/(S.user.days||30);
const short=s=>dt(s).toLocaleDateString('en',{month:'short',day:'numeric'}),tm=t=>{const[h,m]=t.split(':');return(h%12||12)+':'+m+' '+(h<12?'AM':'PM')};
const bars=(L,V,h=-1)=>{const m=Math.max(...V,1),n=V.length,w=300/n,s=n>14?Math.ceil(n/7):1;return`<svg viewBox="0 0 320 150" width="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`+[0,1,2].map(i=>`<line x1="8" x2="312" y1="${115-i*50}" y2="${115-i*50}" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>`).join('')+V.map((v,i)=>{const b=v/m*100,x=10+i*w;return`<rect x="${x+w*.15}" y="${115-b}" width="${w*.7}" height="${v?Math.max(b,3):0}" rx="${Math.min(6,w*.3)}" fill="url(#${i==h?'g2':'g'})" filter="url(#gl)"/>`+(i==h&&v?`<text x="${x+w/2}" y="${108-b}" font-size="9" font-weight="700" text-anchor="middle" fill="#fde68a">${R(v)}</text>`:'')+(i%s==0?`<text x="${x+w/2}" y="134" font-size="9" text-anchor="middle" fill="#a99ccf">${L[i]}</text>`:'')}).join('')+'</svg>'};
const donut=I=>{const t=I.reduce((s,i)=>s+i[1],0),u=t||1;let a=0;const r=52,C=2*Math.PI*r;return`<svg viewBox="0 0 140 140" width="140"><g transform="rotate(-90 70 70)"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="20"/>`+I.map(i=>{const f=i[1]/u*C,l=Math.max(f-2,0),off=-a;a+=f;return`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${gc(i[0])}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${off}" style="filter:drop-shadow(0 0 4px ${gc(i[0])})"/>`}).join('')+`</g><text x="70" y="66" text-anchor="middle" font-size="9" fill="#a99ccf">TOTAL</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#f4efff">${R(t)}</text></svg>`};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};
let V='splash',X={cat:'Lunch',pay:'UPI'},H={f:'week',a:TD(),b:TD()},A={r:'week',t:'c',p:10},T=TD(),RP=0,CH=[{w:'ai',t:'Hi! Ask me about your spending 💜'}];
const go=v=>{V=v;draw();scrollTo(0,0)};
const hero=(t,s)=>`<div class="hero"><div style="opacity:.8">${s}</div><div class="big">${t}</div></div>`;
const card=(l,v,c)=>`<div class="card"><div class="mu">${l}</div><div class="v" ${c?`style="color:${c}"`:''}>${v}</div></div>`;
const back=`<button class="chip" onclick="go('home')">← Home</button>`;
function pct(a,b){return b?Math.min(100,Math.max(0,a/b*100)):0}
const V_={
splash:()=>{setTimeout(()=>{if(V=='splash'&&!CLOUD)go(S.user?'home':'intro')},1300);return`<div class="splash"><div>💜🤍</div><h1 style="margin:8px 0 0">SpendWise</h1><div class="mu">Your calm AI money companion</div></div>`},
intro:()=>`<div class="hero" style="margin-top:20px"><div class="big">💜 SpendWise</div><p>Track every rupee from morning to night, see patterns, and find realistic ways to save.</p></div>
<div class="card"><div class="row"><span>🧾 Log expenses in seconds</span></div><div class="row"><span>📊 Live charts &amp; analytics</span></div><div class="row"><span>🤖 Ask My Money Assistant</span></div><div class="row"><span>🎯 Savings goals that update</span></div></div>
<div class="card"><h3>Create your local profile</h3><label>Name</label><input id="nm" placeholder="Your name"><label>Email (optional)</label><input id="em" type="email" placeholder="you@email.com"><button class="btn" onclick="signup()">Sign up &amp; continue</button><p class="mu">Data stays on this device. No passwords or banking details are stored.</p></div>`,
setup:()=>{const u=S.user;return`<h2>💰 Salary setup</h2><div class="card"><label>Name</label><input id="nm" value="${esc(u.name)}"><label>Monthly salary (₹)</label><input id="sal" type="number" value="${u.salary||''}"><label>Daily income (₹, if paid daily)</label><input id="dly" type="number" value="${u.daily||''}"><label>Other monthly income (₹)</label><input id="oth" type="number" value="${u.other||''}"><label>Days per month for budget estimate</label><input id="dys" type="number" value="${u.days||30}"><label>Monthly savings target (₹)</label><input id="tg" type="number" value="${u.target||''}"><label>Target date</label><input id="td" type="date" value="${u.tdate||''}"><button class="btn" onclick="saveUser()">Save &amp; continue</button></div>
<div class="card"><h3>Custom category</h3><div class="g2"><input id="cn" placeholder="Name"><input id="ce" placeholder="Emoji" maxlength="2"></div><button class="chip" onclick="addCat()">+ Add category</button></div>
<div class="card"><h3>Data</h3>${CLOUD&&AU?`<p class="mu">Signed in as ${esc(AU.email)}</p><button class="chip" onclick="logout()">🚪 Sign out</button>`:''}<button class="chip" onclick="demo()">Load 40-day demo data</button><button class="chip" onclick="copyBackup()">📋 Copy backup</button><textarea id="bk" rows="2" placeholder="Paste a backup here to restore…" style="width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);font:15px inherit;margin:4px 0 10px"></textarea><button class="chip" onclick="restoreBackup()">♻️ Restore backup</button><button class="chip" onclick="if(confirm('Delete ALL data?')){S={user:null,exp:[],goals:[],cats:[],pending:[]};save();go('intro')}">Reset everything</button></div>`},
home:()=>{const u=S.user,m=mon(0),t=TD(),ms=st(m[0],m[1]),td=sum(S.exp.filter(e=>e.date==t)),b=bud(),rem=inc()-ms.tot,L=days(...wk()).map(d=>sum(S.exp.filter(e=>e.date==d)));
return`<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="mu">Welcome back</div><h2 style="margin:0">${esc(u.name)} 💜</h2></div><span><button class="chip" onclick="go('notes')">🔔${S.notes.filter(x=>!x.read).length?' '+S.notes.filter(x=>!x.read).length:''}</button><button class="chip" onclick="go('setup')">⚙️</button></span></div><div style="height:10px"></div>${alertHTML()}
<div class="hero"><div style="opacity:.8">Today's spending (est. budget ${R(b)}/day)</div><div class="big">${R(td)}</div><div class="bar" style="background:rgba(255,255,255,.3);margin:10px 0"><i style="width:${pct(td,b)}%;background:#fff"></i></div><div>${b-td>=0?R(b-td)+' left today':'Over today\'s budget by '+R(td-b)}</div></div>
<div class="g2">${card('Monthly income',R(inc()))}${card("Today's income",R(u.daily||0))}${card('This month spent',R(ms.tot),'var(--p2)')}${card('Remaining this month',R(rem),rem>=0?'var(--ok)':'var(--bad)')}${card('Estimated savings',R(Math.max(rem,0)),'var(--ok)')}${card('Savings goal',R(u.target||0))}${card('Avg daily spend',R(ms.avg))}${card('Top category',ms.top?ms.top[0]:'—')}${card('Highest day',ms.hi?short(ms.hi[0])+' · '+R(ms.hi[1]):'—')}${card('Lowest day',ms.lo?short(ms.lo[0])+' · '+R(ms.lo[1]):'—')}</div>
<div class="card" style="margin-top:12px"><h3>This week</h3>${bars(['M','T','W','T','F','S','S'],L)}</div>
<div class="g2"><button class="btn" onclick="go('timeline')">🕒 Timeline</button><button class="btn" onclick="go('goals')">🎯 Goals</button><button class="btn" onclick="go('report')">📄 Monthly report</button><button class="btn" onclick="A.t='k';go('analytics')">⚖️ Compare days</button><button class="btn" onclick="go('insights')">🧠 AI Insights</button><button class="btn" onclick="go('budget')">🔔 Budgets</button><button class="btn" onclick="go('notes')">📬 Notifications</button><button class="btn" onclick="go('auto')">💳 Auto-detect</button><button class="btn" onclick="go('recur')">🧾 Recurring</button><button class="btn" onclick="go('search')">🔎 Search</button></div>`},
add:()=>{const cs=CATS();return`<h2>➕ Add expense</h2><div class="card"><input id="am" class="amt" type="number" inputmode="decimal" placeholder="₹ 0"><div class="cg">${cs.map(c=>`<button class="ct ${X.cat==c.n?'on':''}" onclick="X.cat='${c.n.replace(/'/g,"\\'")}';draw()"><b>${c.e}</b>${esc(c.n)}</button>`).join('')}</div><label>Description</label><input id="ds" placeholder="${X.cat}"><label>Merchant (optional)</label><input id="mc" placeholder="e.g. Swiggy"><div class="g2"><div><label>Date</label><input id="dd" type="date" value="${TD()}"></div><div><label>Time</label><input id="tt" type="time" value="${pad(new Date().getHours())}:${pad(new Date().getMinutes())}"></div></div><label>Payment</label><div>${['Cash','UPI','Card','Bank'].map(p=>`<button class="chip ${X.pay==p?'on':''}" onclick="X.pay='${p}';keep()">${p}</button>`).join('')}</div><button class="btn" onclick="addExp()">Save expense</button></div>`},
timeline:()=>{const L=S.exp.filter(e=>e.date==T).sort((a,b)=>a.time.localeCompare(b.time));return`<h2>🕒 Daily timeline</h2><input type="date" value="${T}" onchange="T=this.value;draw()">${hero(R(sum(L)),'Total spent '+(T==TD()?'today':short(T)))}<div class="card">${L.map(e=>`<div class="row"><span><span class="dot" style="background:${find(e.cat).c}"></span><b>${tm(e.time)}</b> — ${find(e.cat).e} ${esc(e.desc||e.cat)}</span><b>${R(e.amt)}</b></div>`).join('')||'<p class="mu">No expenses on this day.</p>'}</div>`},
history:()=>{const[a,b]=rng(H.f),L=inR(a,b).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time)),by={};L.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));

${Object.entries(by).map(([d,l])=>`<div class="card"><div class="row"><b>${dt(d).toLocaleDateString('en',{month:'long',day:'numeric',weekday:'short'})}</b><b>${R(sum(l))}</b></div>${l.map(e=>`<div class="row"><span>${tm(e.time)} · ${find(e.cat).e} ${esc(e.desc||e.cat)}<br><span class="mu">${esc(e.cat)} · ${e.pay}</span></span><span><b>${R(e.amt)}</b> <button class="x" onclick="del('${e.id}')">✕</button></span></div>`).join('')}</div>`).join('')||'<p class="mu">Nothing recorded for this period.</p>'}`},
analytics:()=>{const[a,b]=rng(A.r),s=st(a,b),ds_=days(a,b>TD()&&A.r!='week'?b:b),dl=ds_.map(d=>s.dm[d]||0),save_=s.top?s.top[1]*A.p/100:0,bd=bud();
const tabs=`<div>${[['week','This week'],['month','This month'],['prev','Prev month']].map(f=>`<button class="chip ${A.r==f[0]?'on':''}" onclick="A.r='${f[0]}';draw()">${f[1]}</button>`).join('')}</div><div><button class="chip ${A.t=='c'?'on':''}" onclick="A.t='c';draw()">📊 Charts</button><button class="chip ${A.t=='k'?'on':''}" onclick="A.t='k';draw()">⚖️ Daily comparison</button><button class="chip" onclick="go('insights')">🧠 AI insights</button></div>`;
if(A.t=='k'){const ent=days(a,b<TD()?b:TD()).map(d=>[d,s.dm[d]||0]);return`<h2>📈 Analytics</h2>${tabs}<div class="g2">${card('Highest day',s.hi?short(s.hi[0])+' · '+R(s.hi[1]):'—','var(--bad)')}${card('Lowest day',s.lo?short(s.lo[0])+' · '+R(s.lo[1]):'—','var(--ok)')}</div><div class="card" style="margin-top:12px"><div class="mu">Average daily spending</div><div class="v">${R(s.avg)}</div>${ent.map(e=>`<div class="row"><span>${dt(e[0]).toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'})} ${s.hi&&e[0]==s.hi[0]?'<span class="tag">Highest</span>':''}${s.lo&&e[0]==s.lo[0]?'<span class="tag">Lowest</span>':''}</span><b>${R(e[1])}</b></div>`).join('')}</div>`}
const wb=[];for(let i=0;i<dl.length;i+=7)wb.push(dl.slice(i,i+7).reduce((x,y)=>x+y,0));
return`<h2>📈 Analytics</h2>${tabs}<div class="card"><h3>Daily spending</h3>${bars(ds_.map(d=>+d.slice(8)),dl,dl.indexOf(Math.max(...dl)))}</div>${A.r!='week'?`<div class="card"><h3>Weekly comparison</h3>${bars(wb.map((_,i)=>'W'+(i+1)),wb)}</div>`:''}
${trend()}<div class="card"><h3>By category</h3><div style="display:flex;gap:10px;align-items:center">${donut(s.ge)}<div style="flex:1">${s.ge.map(g=>`<div class="row"><span><span class="dot" style="background:${gc(g[0])}"></span>${g[0]}</span><span><b>${R(g[1])}</b> <span class="mu">${(g[1]/s.tot*100).toFixed(0)}%</span></span></div>`).join('')||'<p class="mu">No data</p>'}</div></div></div>
<div class="card"><h3>💡 Saving ideas</h3>${s.top?`<p>You spent <b>${R(s.top[1])}</b> on ${s.top[0]}. Cutting it by <select style="width:auto;display:inline;padding:4px" onchange="A.p=+this.value;draw()">${[5,10,15,20].map(p=>`<option ${p==A.p?'selected':''}>${p}</option>`).join('')}</select>% could free up about <b>${R(save_)}</b> (estimate).</p><p>Average daily spend is ${R(s.avg)} vs. estimated daily budget ${R(bd)} — ${s.avg>bd?'a little above, so small tweaks may help.':'right on track. Nice work! 💜'}</p>`:'<p class="mu">Add expenses to get suggestions.</p>'}</div>`},
goals:()=>`<h2>🎯 Savings goals</h2>${S.goals.map((g,i)=>{const left=g.target-g.cur,dl=g.date?Math.max(1,Math.ceil((dt(g.date)-dt(TD()))/864e5)):0;return`<div class="card"><div class="row"><b>${esc(g.name)}</b><button class="x" onclick="S.goals.splice(${i},1);save();draw()">✕</button></div><div class="v">${R(g.cur)} / ${R(g.target)}</div><div class="bar" style="margin:8px 0"><i style="width:${pct(g.cur,g.target)}%"></i></div>${g.date&&left>0?`<div class="mu">Save ~${R(left/dl)}/day or ~${R(left/Math.max(1,dl/30))}/month to reach it by ${short(g.date)}</div>`:left<=0?'<div class="tag">🎉 Goal reached</div>':''}<div class="g2" style="margin-top:8px"><input id="gi${i}" type="number" placeholder="Add ₹" style="margin:0"><button class="btn" onclick="addG(${i})">Add</button></div></div>`}).join('')}
<div class="card"><h3>New goal</h3><input id="gn" placeholder="e.g. Emergency Fund"><input id="gt" type="number" placeholder="Target ₹"><input id="gc" type="number" placeholder="Already saved ₹"><input id="gd" type="date"><button class="btn" onclick="newG()">Create goal</button></div>`,
report:()=>{const m=mon(RP),s=st(m[0],m[1]),I=inc(),dl=days(m[0],m[1]),tr=dl.map(d=>s.dm[d]||0);return`<h2>📄 ${m[2]} summary</h2><div><button class="chip ${RP==0?'on':''}" onclick="RP=0;draw()">This month</button><button class="chip ${RP==-1?'on':''}" onclick="RP=-1;draw()">Previous</button></div>${hero(R(I-s.tot),'Remaining of '+R(I)+' income')}<div class="card"><div class="row"><span>Spent</span><b>${R(s.tot)}</b></div><div class="row"><span>Estimated savings</span><b style="color:var(--ok)">${R(Math.max(I-s.tot,0))}</b></div><div class="row"><span>Avg daily spending</span><b>${R(s.avg)}</b></div><div class="row"><span>Highest day</span><b>${s.hi?short(s.hi[0])+' — '+R(s.hi[1]):'—'}</b></div><div class="row"><span>Lowest day</span><b>${s.lo?short(s.lo[0])+' — '+R(s.lo[1]):'—'}</b></div><div class="row"><span>Highest category</span><b>${s.top?s.top[0]:'—'}</b></div><div class="row"><span>Lowest category</span><b>${s.low?s.low[0]:'—'}</b></div></div><div class="card"><h3>Category-wise</h3>${s.ge.map(g=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:2px 0"><span>${g[0]}</span><b>${R(g[1])}</b></div><div class="bar"><i style="width:${pct(g[1],s.tot)}%;background:${gc(g[0])}"></i></div></div>`).join('')||'<p class="mu">No data</p>'}</div><div class="card"><h3>Spending trend</h3>${bars(dl.map(d=>+d.slice(8)),tr)}</div><div class="card"><h3>Goals</h3>${S.goals.map(g=>`<div class="row"><span>${esc(g.name)}</span><b>${pct(g.cur,g.target).toFixed(0)}%</b></div>`).join('')||'<p class="mu">No goals yet.</p>'}</div>`},
insights:()=>{const m=mon(0),pm=mon(-1),s=st(m[0],m[1]),p=st(pm[0],pm[1]),dn=new Date().getDate(),ps=st(pm[0],pm[0].slice(0,8)+pad(Math.min(dn,+pm[1].slice(8)))),b=bud();
if(!s.L.length)return`<h2>🧠 AI Insights</h2>${back}<div class="card"><p>No expenses this month yet. Add some, or load demo data from ⚙️ Profile.</p></div>`;
const chg=(a,c)=>c?(a-c)/c*100:null,fp=x=>x==null?'—':(x>0?'▲ ':'▼ ')+Math.abs(x).toFixed(0)+'%',col=x=>x==null?'var(--mu)':x>0?'var(--bad)':'var(--ok)',c1=chg(s.tot,ps.tot),sg=[];
s.ge.slice(0,2).forEach(g=>sg.push(`You spent ${R(g[1])} on ${g[0]} this month. Reducing it by 10% could potentially save about ${R(g[1]*.1)}.`));
if(b>0)sg.push(s.avg>b?`Your average daily spending (${R(s.avg)}) is above your estimated daily budget (${R(b)}). Trimming about ${R(s.avg-b)} a day would bring you back in line.`:`Your average daily spending (${R(s.avg)}) is within your estimated daily budget (${R(b)}). Nice consistency!`);
const eo=sum(s.L.filter(e=>['Restaurant','Delivery'].includes(e.cat)));if(eo>0)sg.push(`Restaurants & delivery came to ${R(eo)}. Swapping a few for home meals might save around ${R(eo*.2)} — only if it suits you.`);
if(s.hi[1]>2*s.avg)sg.push(`On ${short(s.hi[0])} you spent ${R(s.hi[1])}, over 2× your average. Planning bigger purchases ahead can smooth things out.`);
const r4=(l,a,b2,c)=>`<div class="row" style="gap:6px"><span style="flex:1.1">${l}</span><b style="flex:1;text-align:right">${a}</b><b style="flex:1;text-align:right">${b2}</b><b style="flex:.7;text-align:right;color:${col(c)}">${fp(c)}</b></div>`;
return`<h2>🧠 AI Insights</h2>${back}<div class="hero"><div style="opacity:.85">${m[2]} vs ${pm[2]}</div><div style="font-size:19px;font-weight:700;margin-top:4px">${c1==null?'No data from last month yet to compare.':`Through day ${dn}, you spent ${Math.abs(c1).toFixed(0)}% ${c1<=0?'less':'more'} than the same days last month.`}</div></div>
<h3>Spending analysis</h3><div class="g2">${card('Highest category',s.top[0]+' · '+R(s.top[1]))}${card('Lowest category',s.low[0]+' · '+R(s.low[1]))}${card('Highest day',short(s.hi[0])+' · '+R(s.hi[1]))}${card('Average daily',R(s.avg))}${card('Total this month',R(s.tot),'var(--p2)')}</div>
<h3 style="margin-top:14px">Saving suggestions</h3>${sg.map(x=>`<div class="card">💡 ${x}</div>`).join('')}<p class="mu">Estimates from your recorded spending — not guarantees.</p>
<h3>Monthly comparison</h3><div class="card"><div class="row" style="gap:6px"><span style="flex:1.1"></span><span class="mu" style="flex:1;text-align:right">${m[2]}</span><span class="mu" style="flex:1;text-align:right">${pm[2]}</span><span class="mu" style="flex:.7;text-align:right">Change</span></div>${r4('Total',R(s.tot),R(p.tot),chg(s.tot,p.tot))}${r4('Avg / day',R(s.avg),R(p.avg),chg(s.avg,p.avg))}${r4('Top category',s.top[0],p.top?p.top[0]:'—',null)}${bars([pm[2].slice(0,3),m[2].slice(0,3)],[p.tot,s.tot],s.tot>p.tot?1:0)}<p class="mu">${m[2]} is still in progress, so the headline compares equal days.</p></div>`},
budget:()=>{const u=S.user,t=TD(),m=mon(0),td=sum(S.exp.filter(e=>e.date==t)),ms=sum(inR(m[0],m[1])),row=(n,b,x)=>{if(!(b>0))return`<div class="card"><h3>${n} budget</h3><p class="mu">Not set. Enter an amount below to turn on alerts.</p></div>`;const p=x/b*100,c=p>=100?'#fb7185':p>=80?'#fbbf24':'var(--ok)';return`<div class="card"><h3>${n} budget</h3><div class="v">${R(x)} / ${R(b)}</div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(p,100)}%;${p>=80?'background:'+c:''}"></i></div><b style="color:${c}">${p>=100?'🚨 Exceeded by '+R(x-b):p>=80?'⚠️ '+p.toFixed(0)+'% used — nearing your limit':'✅ On track · '+R(b-x)+' left'}</b></div>`};
return`<h2>🔔 Budget alerts</h2>${back}${row('Daily',u.dBudget,td)}${row('Monthly',u.mBudget,ms)}<div class="card"><h3>Set budgets</h3><label>Daily budget (₹)</label><input id="db" type="number" value="${u.dBudget||''}"><label>Monthly budget (₹)</label><input id="mb" type="number" value="${u.mBudget||''}"><button class="btn" onclick="saveBudget()">Save budgets</button><p class="mu">Warning at 80%, alert when exceeded. Leave blank to turn off.</p></div>${catB()}`},
notes:()=>{const P=NP||('Notification' in window?Notification.permission:'unsupported'),m=mon(0),s=st(m[0],m[1]);S.notes.forEach(x=>x.read=1);save();
return`<h2>📬 Notifications</h2>${back}<div class="card"><h3>Device notifications</h3><p class="mu">Status: <b>${P=='granted'?'✅ Allowed':P=='denied'?'❌ Blocked — enable in system settings':P=='unsupported'?'Not supported in this browser':'Not enabled yet'}</b>. Every alert is saved below. ${NAT?'Scheduled reminders also arrive when the app is closed.':'System pop-ups on your phone appear while SpendWise is open in your browser.'}</p>${P=='default'?'<button class="btn" onclick="askPerm()">Enable notifications</button>':''}${NAT&&EX=='denied'?'<button class="chip" onclick="NAT.changeExactNotificationSetting().then(()=>setTimeout(schedSoon,800))">⏰ Allow exact reminder timing</button>':''}<div style="margin-top:8px"><button class="chip" onclick="notify('t','💜 Test notification','SpendWise notifications are working!',1);draw()">Send test</button>${NAT?'<button class="chip" onclick="testLater()">⏱️ Test in 1 min</button>':''}<button class="chip" onclick="sendRep('d')">🌙 Daily summary</button><button class="chip" onclick="sendRep('w')">📅 Weekly report</button><button class="chip" onclick="sendRep('m')">💜 Monthly report</button></div></div>
${s.ge.length?`<div class="card"><h3>💡 Saving suggestions</h3>${s.ge.slice(0,2).map(g=>`<p>You spent ${R(g[1])} on ${g[0]} this month. A 10% cut could potentially save about ${R(g[1]*.1)}.</p>`).join('')}</div>`:''}
${S.notes.map(x=>`<div class="card"><b>${esc(x.t)}</b><div>${esc(x.b)}</div><div class="mu">${new Date(x.at).toLocaleString()}</div></div>`).join('')||'<p class="mu">No notifications yet. Alerts appear here automatically.</p>'}${S.notes.length?'<button class="chip" onclick="S.notes=[];save();draw()">Clear list</button>':''}`},
auto:()=>`<h2>💳 Auto-detect expenses</h2>${back}<div class="card"><h3>How it works</h3><p class="mu">Web apps can't read your SMS or other apps' notifications, even with permission. Paste (or share) a bank/UPI SMS here: SpendWise extracts amount, merchant, time and payment method, asks you to confirm, then saves it to history. OTP/security messages are rejected, and the SMS text itself is never stored. Fully automatic reading needs a native Android build; the pending queue is already in place for it.</p></div><div class="card"><textarea id="sms" rows="4" placeholder="Paste a bank/UPI debit SMS…" style="width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);font:15px inherit;margin:4px 0 10px"></textarea><button class="btn" onclick="detect()">Detect transaction</button><div style="margin-top:8px"><button class="chip" onclick="document.getElementById('sms').value='Rs 450.00 debited from A/c XX1234 on 05-Oct-26 to swiggy@icici via UPI. Ref 8123'">Use sample SMS</button></div></div>${S.pending.map((p,i)=>`<div class="card"><div class="v">${R(p.amt)} transaction detected</div><div class="mu">${esc(p.merchant)} · ${short(p.date)} ${tm(p.time)} · ${p.pay}</div><select id="pc${i}">${CATS().map(c=>`<option ${c.n==p.cat?'selected':''}>${esc(c.n)}</option>`).join('')}</select><div class="g2"><button class="btn" onclick="addP(${i})">Add Expense</button><button class="chip" onclick="S.pending.splice(${i},1);save();draw()">Ignore</button></div></div>`).join('')}`,
recur:()=>{const t=TD(),dn=new Date().getDate();return`<h2>🧾 Recurring expenses</h2>${back}${S.rec.map((r,i)=>`<div class="card"><div class="row"><b>${esc(r.name)} · ${R(r.amt)}</b><button class="x" onclick="S.rec.splice(${i},1);save();draw()">✕</button></div><div class="mu">${find(r.cat).e} ${esc(r.cat)} · monthly on day ${r.day} · ${r.pay}</div>${dueDay(r)==dn&&r.last!=t?`<button class="btn" style="margin-top:8px" onclick="payRec(${i})">Due today — add expense</button>`:''}</div>`).join('')||'<p class="mu">No recurring expenses yet.</p>'}<div class="card"><h3>New recurring expense</h3><input id="rn" placeholder="e.g. Rent, Netflix"><input id="ra" type="number" placeholder="Amount ₹"><select id="rc">${CATS().map(c=>`<option>${esc(c.n)}</option>`).join('')}</select><input id="rd" type="number" min="1" max="31" placeholder="Day of month (1-31)"><select id="rp">${['UPI','Cash','Card','Bank'].map(p=>`<option>${p}</option>`).join('')}</select><button class="btn" onclick="newRec()">Add recurring</button></div>`},
search:()=>{const q=F.q.toLowerCase(),mc=F.mc.toLowerCase(),L=S.exp.filter(e=>(!F.a||e.date>=F.a)&&(!F.b||e.date<=F.b)&&(!F.cat||e.cat==F.cat)&&(!F.pay||e.pay==F.pay)&&(F.min===''||e.amt>=+F.min)&&(F.max===''||e.amt<=+F.max)&&(!mc||(e.merchant||'').toLowerCase().includes(mc))&&(!q||(e.desc+' '+e.cat+' '+(e.merchant||'')).toLowerCase().includes(q))).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));
return`<h2>🔎 Search &amp; filter</h2>${back}<button class="chip" onclick="go('history')">📜 History</button><div class="card"><input id="fq" placeholder="Search text" value="${esc(F.q)}"><input id="fm" placeholder="Merchant" value="${esc(F.mc)}"><div class="g2"><div><label>From</label><input id="fa" type="date" value="${F.a}"></div><div><label>To</label><input id="fb" type="date" value="${F.b}"></div><div><label>Min ₹</label><input id="fn" type="number" value="${F.min}"></div><div><label>Max ₹</label><input id="fx" type="number" value="${F.max}"></div></div><div class="g2" style="margin-top:8px"><select id="fc"><option value="">All categories</option>${CATS().map(c=>`<option ${F.cat==c.n?'selected':''}>${esc(c.n)}</option>`).join('')}</select><select id="fp"><option value="">All payments</option>${['Cash','UPI','Card','Bank'].map(p=>`<option ${F.pay==p?'selected':''}>${p}</option>`).join('')}</select></div><div class="g2"><button class="btn" onclick="applyF()">Apply</button><button class="chip" onclick="clrF()">Clear</button></div></div><div class="card"><b>${L.length} results · ${R(sum(L))}</b>${L.slice(0,150).map(e=>`<div class="row"><span>${find(e.cat).e} ${esc(e.merchant||e.desc||e.cat)}<br><span class="mu">${short(e.date)} ${tm(e.time)} · ${esc(e.cat)} · ${e.pay}</span></span><span><b>${R(e.amt)}</b> <button class="x" onclick="del('${e.id}')">✕</button></span></div>`).join('')}</div>`},
auth:()=>`<div class="splash" style="height:auto;padding:24px 0 8px;font-size:48px"><div>💜🤍</div><h1 style="margin:6px 0 0;font-size:30px">SpendWise</h1><div class="mu">Sign in to your private money tracker</div></div><div class="card"><div style="margin-bottom:8px"><button class="chip ${AM=='in'?'on':''}" onclick="AM='in';draw()">Sign in</button><button class="chip ${AM=='up'?'on':''}" onclick="AM='up';draw()">Create account</button></div>${AM=='up'?'<label>Name</label><input id="an" placeholder="Your name">':''}<label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="you@email.com"><label>Password</label><input id="ap" type="password" autocomplete="${AM=='up'?'new-password':'current-password'}" placeholder="${AM=='up'?'At least 6 characters':'Your password'}"><button class="btn" onclick="doAuth()">${AM=='up'?'Create account':'Sign in'}</button>${AM=='in'?'<p style="text-align:center"><a href="#" onclick="forgot();return false" style="color:var(--p2)">Forgot password?</a></p>':''}<p class="mu">Your data is private to your account and syncs across your devices.</p></div>`,
assistant:()=>`<h2>🤖 My Money Assistant</h2><div class="card" style="min-height:200px">${CH.map(m=>`<div class="msg ${m.w=='me'?'me':'ai'}">${esc(m.t)}</div>`).join('')}</div><div>${['How much did I spend on food this month?','Which day did I spend the most?','Which category costs me the most?','How much did I spend this week?','How much can I potentially save?','Compare this month with last month'].map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join('')}</div><div class="g2" style="grid-template-columns:3fr 1fr;margin-top:8px"><input id="q" placeholder="Ask about your money…" onkeydown="if(event.key=='Enter')ask()" style="margin:0"><button class="btn" onclick="ask()">Send</button></div>`};
function reply(q){q=q.toLowerCase();const m=mon(0),pm=mon(-1),w=wk(),t=TD();const per=/week/.test(q)?['this week',...w]:/today/.test(q)?['today',t,t]:/last month|previous/.test(q)?['last month',pm[0],pm[1]]:['this month',m[0],m[1]],s=st(per[1],per[2]);
if(!S.exp.length)return'No expenses recorded yet. Add some and I can answer from your data!';
if(/compare/.test(q)){const a=st(m[0],m[1]).tot,b=st(pm[0],pm[1]).tot;return`This month: ${R(a)}. Last month: ${R(b)}. ${a>b?'Up':'Down'} by ${R(Math.abs(a-b))}${b?' ('+(Math.abs(a-b)/b*100).toFixed(0)+'%)':''}. (This month is still in progress.)`}
if(/save|saving/.test(q)){const k=st(m[0],m[1]);return k.top?`Your top category this month is ${k.top[0]} (${R(k.top[1])}). A 10% cut could save about ${R(k.top[1]*.1)}/month. That's an estimate, not a promise.`:'Not enough data yet.'}
